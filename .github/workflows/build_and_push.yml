name: Build and Push Image
run-name: Build image for ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/j-toscani/bb-league-viewer
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Extract version from tag
        id: tag
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-and-push:
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:${{ needs.extract-version.outputs.version }}-staging

      - name: Deploy to Staging
        run: |
          HOOK_URL="${{ secrets.DEPLOY_HOOK_URL }}"
          if [ -n "$HOOK_URL" ]; then
            curl -sf -X POST "$HOOK_URL" \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5
            echo "✅ Deployed to staging"
          else
            echo "⚠️ Kein Deploy-Hook konfiguriert"
          fi
